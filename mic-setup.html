<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Global Voice - Microphone Setup</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      max-width: 400px;
    }
    h1 {
      margin-bottom: 10px;
    }
    p {
      margin-bottom: 30px;
      opacity: 0.9;
    }
    button {
      background: white;
      color: #667eea;
      border: none;
      padding: 15px 40px;
      font-size: 18px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 8px;
    }
    .status.success {
      background: rgba(76, 175, 80, 0.3);
    }
    .status.error {
      background: rgba(244, 67, 54, 0.3);
    }
    .instructions {
      margin-top: 30px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎤 Microphone Access</h1>
    <p>Global Voice needs microphone permission to record and transcribe your voice.</p>
    <button id="enable-mic">Enable Microphone</button>
    <div id="status" class="status" style="display: none;"></div>
    <div class="instructions">
      <p>If you don't see a permission prompt, check:<br>
      <strong>macOS:</strong> System Settings → Privacy & Security → Microphone → Chrome ✓</p>
    </div>
  </div>
  <script src="mic-setup.js"></script>
</body>
</html>
